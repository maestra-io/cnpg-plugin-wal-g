name: CI

on:
  push:
    branches: [ main, 'maestra/**' ]
  pull_request:
    branches: [ main, 'maestra/**' ]

# The toolchain comes from nora only (3-day hold, issues-maestra#1649), with the job's OIDC token, as on
# main. A fork PR gets no such token: these jobs fail there on purpose, with no unheld fallback. No fork
# PR has ever been opened here; its changes are pushed to a branch of this repository to be checked.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # setup-*-nora: the toolchain from nora
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: maestra-io/github-actions/setup-go-nora@f40b5191253ae7e28c10836989a77255666141e4 # v1.104.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Verify dependencies
        run: go mod verify

      # GitHub Releases through nora (packages.maestra.io): 3-day hold, issues-maestra#1649.
      # Bump the version and the sha256 (the release's asset digest) together.
      - name: golangci-lint through nora
        uses: maestra-io/github-actions/nora-asset@a4ecbf696bc63094df4bbe9378bdf8fd170839e9 # v1.115.5
        with:
          path: github/golangci/golangci-lint/releases/download/v2.11.4/golangci-lint-2.11.4-linux-amd64.tar.gz
          sha256: 200c5b7503f67b59a6743ccf32133026c174e272b930ee79aa2aa6f37aca7ef1
          bin: golangci-lint
          member: golangci-lint-2.11.4-linux-amd64/golangci-lint
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          install-mode: none

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # setup-*-nora: the toolchain from nora
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: maestra-io/github-actions/setup-go-nora@f40b5191253ae7e28c10836989a77255666141e4 # v1.104.0
        with:
          go-version-file: 'go.mod'
          cache: true

      # What `make test` (setup-envtest) would take from GitHub Releases, through nora (3-day hold,
      # issues-maestra#1649): it uses the matching version it finds in bin/k8s. A new k8s.io/api minor
      # needs its envtest version and sha256 here.
      - name: envtest through nora
        id: envtest
        uses: maestra-io/github-actions/nora-asset@a4ecbf696bc63094df4bbe9378bdf8fd170839e9 # v1.115.5
        with:
          path: github/kubernetes-sigs/controller-tools/releases/download/envtest-v1.36.2/envtest-v1.36.2-linux-amd64.tar.gz
          sha256: 5e99f4eef3d6f9d4dd063730299f708c98da8801f2f14d8fc762cb354f30c332
      - name: Place envtest
        env:
          TGZ: ${{ steps.envtest.outputs.file }}
        run: |
          mkdir -p bin/k8s/1.36.2-linux-amd64
          tar -xzf "$TGZ" --strip-components=2 -C bin/k8s/1.36.2-linux-amd64

      - name: Run tests
        run: make test

  manifests:
    name: Generated files up to date
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # setup-*-nora: the toolchain from nora
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: maestra-io/github-actions/setup-go-nora@f40b5191253ae7e28c10836989a77255666141e4 # v1.104.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Regenerate CRDs, RBAC and deepcopy
        run: make manifests generate

      - name: Fail on drift
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            git diff
            echo "::error::generated files are stale: run 'make manifests generate' and commit the result"
            exit 1
          fi

  build:
    name: Build
    # A fork PR gets no OIDC token, and the image needs nora: build only our own PRs and pushes.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # nora OIDC token for the image build
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: maestra-io/github-actions/setup-go-nora@f40b5191253ae7e28c10836989a77255666141e4 # v1.104.0
        with:
          go-version-file: 'go.mod'
          cache: true

      # Base images, apt and Go modules through nora (issues-maestra#1649): a credential helper
      # mints a fresh GitHub OIDC token per credential read, and the RUN-mount secret is a file
      # refreshed every 60 s.
      - name: nora docker credentials
        run: bash .github/scripts/nora-docker-credentials.sh

      - name: nora token for the image build
        run: bash .github/scripts/packages-token.sh

      - name: Build binary and docker image
        run: make build docker-build

      - name: nora token refresh log
        if: failure()
        run: cat "$RUNNER_TEMP/packages-token/refresh.log" 2>/dev/null || echo "no failed refreshes"

  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # setup-*-nora: the toolchain from nora
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Helm
        uses: maestra-io/github-actions/setup-helm-nora@f40b5191253ae7e28c10836989a77255666141e4 # v1.104.0
        with:
          version: 'latest'

      - name: Lint Helm chart
        run: helm lint ./chart