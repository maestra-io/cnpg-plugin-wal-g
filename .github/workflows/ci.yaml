name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.11

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run tests
        run: make test

  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # nora OIDC token for the image build
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: 'go.mod'
          cache: true

      # BuildKit pulls the base images through nora (packages.maestra.io, issues-maestra#1649)
      # with ~/.docker/config.json. nora takes the GitHub OIDC token, which lives minutes: a
      # credential helper mints a fresh one per pull. Same step as dotnet-service-build.yml in
      # maestra-io/github-actions.
      - name: nora docker credentials
        env:
          AUDIENCE: packages.maestra.io
          PACKAGES_URL: https://packages.maestra.io
        run: |
          # >>> nora-cred-helper (copy of maestra-io/github-actions dotnet-service-build.yml)
          bin="$RUNNER_TEMP/nora-bin"; mkdir -p "$bin"
          # The helper runs in the caller's environment, which tox and other test runners
          # scrub: the job's OIDC request URL and token go to a 0600 file next to it.
          ( umask 077; printf 'url=%q\ntoken=%q\naud=%q\n' "$ACTIONS_ID_TOKEN_REQUEST_URL" \
            "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$AUDIENCE" > "$bin/oidc.env" )
          cat > "$bin/docker-credential-nora" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          [ "${1:-}" = get ] || exit 0
          server=$(cat) # docker sends it without a newline
          . "${BASH_SOURCE[0]%/*}/oidc.env"
          t=$(curl -sSf --retry 3 --connect-timeout 10 --max-time 30 -H "Authorization: bearer $token" \
            "$url&audience=$aud" | jq -r '.value // empty')
          [ -n "$t" ]
          jq -cn --arg s "$server" --arg t "$t" '{ServerURL: $s, Username: "token", Secret: $t}'
          EOF
          chmod 755 "$bin/docker-credential-nora"
          echo "$bin" >> "$GITHUB_PATH"
          host="${PACKAGES_URL#*://}"; host="${host%%/*}"
          cfg="${DOCKER_CONFIG:-$HOME/.docker}/config.json"; mkdir -p "$(dirname "$cfg")"
          [ -s "$cfg" ] || echo '{}' > "$cfg"
          jq --arg h "$host" '.credHelpers[$h] = "nora"' "$cfg" > "$cfg.t" && mv "$cfg.t" "$cfg"
          # <<< nora-cred-helper

      # apt and Go modules inside the build go through nora (issues-maestra#1649): a fresh
      # OIDC token (minutes-lived) for the BuildKit secret, minted right before the build.
      - name: nora token for the image build
        id: nora
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const t = await core.getIDToken('packages.maestra.io');
            core.setSecret(t);
            core.setOutput('token', t);

      - name: Build binary and docker image
        env:
          PRIVATE_PACKAGES_TOKEN: ${{ steps.nora.outputs.token }}
        run: make build docker-build

  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Helm
        uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with:
          version: 'latest'

      - name: Lint Helm chart
        run: helm lint ./chart